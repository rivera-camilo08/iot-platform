version: "3.9"

x-common-env: &common-env
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  MQTT_BROKER_HOST: ${MQTT_BROKER_HOST}
  MQTT_BROKER_PORT: ${MQTT_BROKER_PORT}
  MQTT_CLIENT_ID: ${MQTT_CLIENT_ID}
  MQTT_USERNAME: ${MQTT_USERNAME}
  MQTT_PASSWORD: ${MQTT_PASSWORD}

services:
  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  api:
    build: .
    command: >
      sh -c "python -m iot_platform.app.db.wait_for_db && alembic upgrade head && uvicorn iot_platform.app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  mqtt-listener:
    build: .
    command: ["python", "-m", "iot_platform.app.mqtt.listener"]
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

volumes:
  db_data:
  mosquitto_data:
  mosquitto_log:
